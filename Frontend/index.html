<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light only" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>SkyHotel</title>
  <link rel="icon" href="images/logo-sky-hotel-mark.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap">
  <script src="js/theme.js?v=24"></script>
  <link rel="stylesheet" href="css/theme.css?v=25" />
  <link rel="stylesheet" href="css/shell.css?v=31" />
</head>

<body>
  <header id="hd"></header>
  <main id="main">
    <nav id="sd" aria-label="Điều hướng quản trị"></nav>
    <div class="sd-overlay" id="sd-overlay" data-sd-close="1" aria-hidden="true"></div>
    <iframe id="fr" title="SkyHotel"></iframe>
  </main>
  <div class="toast" id="toast"></div>

  <!-- Wishlist Drawer Modal -->
  <div class="sky-fav-overlay" id="fav-overlay" aria-hidden="true"></div>
  <aside class="sky-fav-drawer" id="fav-drawer" aria-label="Danh sách phòng yêu thích" aria-hidden="true">
    <div class="sky-fav-header">
      <div class="sky-fav-title">
        <span class="sky-fav-icon">♥</span>
        <b>PHÒNG YÊU THÍCH</b>
        <span class="sky-fav-badge" id="drawer-fav-count">0</span>
      </div>
      <button class="sky-fav-close" id="fav-close-btn" type="button" aria-label="Đóng danh sách yêu thích">
        ✕
      </button>
    </div>
    <div class="sky-fav-body" id="fav-drawer-body"></div>
    <div class="sky-fav-footer">
      <button class="sky-fav-btn-viewpage" id="fav-view-full" type="button">
        Xem trang so sánh đầy đủ →
      </button>
      <button class="sky-fav-btn-clear" id="fav-drawer-clear" type="button">
        Xóa tất cả
      </button>
    </div>
  </aside>

  <script src="js/hotel-api.js?v=19"></script>
  <script src="js/guard.js?v=29"></script>
  <script src="js/sky-api.js?v=18"></script>
  <script src="js/wishlist.js?v=17"></script>
  <script src="js/ui-dialog.js?v=1"></script>
  <script src="js/shell.js?v=31"></script>
</body>

</html>
